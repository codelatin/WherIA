{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WherIA{% endblock %}</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'dist/output.css' %}">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900">

   <nav class="bg-white border-b border-gray-200 h-14 flex items-center px-6 gap-4">
  <a href="/" class="text-lg font-semibold text-emerald-600">WherIA</a>

  <a href="/busqueda/"
     class="text-sm text-gray-500 hover:text-emerald-600 ml-2">
    Buscar
  </a>

  <div class="ml-auto flex items-center gap-3">
  {% if user.is_authenticated %}
    <a href="/panel/"
       class="text-sm text-gray-500 hover:text-emerald-600">
      Mi panel
    </a>
    <span class="text-sm text-gray-600">Hola, {{ user.username }}</span>
    <a href="/logout/"
       class="text-sm px-3 py-1.5 border border-gray-200 rounded-lg text-gray-600 hover:border-gray-300">
      Salir
    </a>
  {% else %}
    <a href="/registro/"
       class="text-sm text-gray-500 hover:text-emerald-600">
      Registrarse
    </a>
    <a href="/login/"
       class="text-sm px-3 py-1.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">
      Ingresar
    </a>
  {% endif %}
</div>
</nav>

    <!-- Contenido principal -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
